[project]
name = "sentinel-control-plane"
version = "0.1.0"
description = "Deterministic Sentinel control plane for a modular multi-agent system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["concept_mesh"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
