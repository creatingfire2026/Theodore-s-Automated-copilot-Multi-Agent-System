name: Sentinel CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Sentinel and tests
        run: python -m compileall -q sentinel.py swarm_router.py aip001_council.py github_actions_evidence.py dissent_store.py dissent_cli.py dissent_witness.py dissent_witness_keygen.py approval_verifier.py audit_log.py sentinel_gateway.py mcp_server.py tests
      - name: Validate Cloudflare witness Worker syntax
        run: node --check cloudflare/dissent-witness/worker.mjs
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest cryptography -r requirements-mcp.txt
      - name: Run regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
