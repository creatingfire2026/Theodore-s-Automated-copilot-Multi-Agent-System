name: Sentinel CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Sentinel and tests
        run: python -m compileall -q sentinel.py tests
      - name: Run Sentinel regression tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q
