name: Sentinel and Orchestrator CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile authorization and orchestration modules
        run: python -m compileall -q sentinel.py orchestrator.py tests
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run regression suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
