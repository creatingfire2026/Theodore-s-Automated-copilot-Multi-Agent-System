name: Sentinel CI

on:
  push:
    branches: [main, "repair/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run deterministic tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q sentinel.py tests
